<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Claw'd</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d1a;--panel:#111122;--border:#1e1e3a;--border2:#2a2a50;
  --orange:#c4724a;--dark:#8b4a2e;--hi:#e09060;
  --accent:#f5c842;--accent2:#e85d3a;
  --blue:#4a8fff;--pink:#ff6699;--green:#44dd88;--purple:#cc88ff;
  --text:#e8dcc8;--dim:#5a5a7a;--bar-h:5px;
}
html,body{width:100%;height:100%;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
#shell{
  width:min(340px,100vw);height:min(600px,100vh);
  background:var(--panel);border:2px solid var(--border2);
  box-shadow:0 0 60px rgba(196,114,74,.12),inset 0 1px 0 rgba(255,255,255,.04);
  display:flex;flex-direction:column;position:relative;overflow:hidden;
  font-family:'Press Start 2P',monospace;image-rendering:pixelated;
}
#shell::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);
  pointer-events:none;z-index:100;}
#topbar{background:#0a0a16;border-bottom:1px solid var(--border);padding:6px 10px 5px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#topbar .logo{font-size:9px;color:var(--accent);letter-spacing:2px}
#topbar .clock{font-size:7px;color:var(--dim)}
#topbar .day{font-size:7px;color:var(--accent2)}
#stage{position:absolute;top:32px;left:8px;font-size:6px;color:var(--dim);
  background:#0a0a16;border:1px solid var(--border);padding:2px 5px;z-index:10;}
#scene{flex:1;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#070d1e 0%,#0d1a3a 55%,#3a5a30 55%,#2d4825 100%);
  min-height:0;}
.star{position:absolute;background:#fff;animation:tw 2s infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:.9}}
#ground{position:absolute;bottom:0;left:0;right:0;height:45%}
.gt{position:absolute;bottom:0;width:16px;height:100%}
#tree{position:absolute;right:36px;bottom:45%;transform-origin:bottom center;}
.t-trunk{width:10px;height:18px;background:#5a3010;margin:0 auto}
.t-leaves{width:36px;height:32px;background:#2d6030;position:relative;box-shadow:inset -3px -3px 0 #1a4020}
.t-apple{position:absolute;width:6px;height:6px;background:#c82020;box-shadow:inset -1px -1px 0 #801010}
.ta1{bottom:5px;left:6px}.ta2{bottom:9px;right:6px}.ta3{bottom:3px;right:12px}
.cloud{position:absolute;background:rgba(100,140,220,.1);animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(360px)}}
#clawd-wrap{position:absolute;cursor:grab;touch-action:none;user-select:none;z-index:10;}
#clawd-canvas{display:block;width:64px;height:64px;image-rendering:pixelated;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.4));}
#bubble{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
  background:#fff;border:2px solid #222;padding:3px 7px;font-size:9px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .15s;color:#222;}
#bubble.show{opacity:1}
#bubble::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:4px solid transparent;border-top:5px solid #222;}
.particle{position:absolute;pointer-events:none;font-size:12px;animation:pfloat 1.4s ease-out forwards}
@keyframes pfloat{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-36px) scale(.6)}}
.zzz-p{color:#6aadff;font-size:8px;animation:pfloat 2.2s ease-out forwards}
#emotions{background:#0a0a16;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:7px 10px 6px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px 8px;flex-shrink:0;}
.emo{display:flex;flex-direction:column;gap:2px}
.emo-label{font-size:5px;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.emo-track{height:var(--bar-h);background:#0e0e20;border:1px solid var(--border)}
.emo-fill{height:100%;transition:width .6s ease,background .6s}
#ptag{text-align:center;font-size:6px;color:var(--accent);padding:3px 0 2px;
  background:#0a0a16;letter-spacing:1px;border-bottom:1px solid var(--border);flex-shrink:0;}
#log{background:#07070f;padding:5px 10px;font-size:6px;color:var(--accent);line-height:1.9;
  min-height:20px;flex-shrink:0;border-bottom:1px solid var(--border);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
#actions{padding:8px 8px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  background:#0a0a16;flex-shrink:0;}
.btn{background:#0d0d1e;border:1px solid var(--border2);color:var(--text);
  font-family:'Press Start 2P',monospace;font-size:5px;padding:6px 2px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;transition:background .1s,border-color .1s,transform .08s;user-select:none;}
.btn:hover{background:#1a1a30;border-color:var(--accent)}
.btn:active{transform:scale(.94);background:#22223a}
.btn .bi{font-size:16px;line-height:1}
.btn.locked{opacity:.35;pointer-events:none}
#chat-panel{position:absolute;inset:0;background:#08080f;display:flex;flex-direction:column;
  z-index:50;transform:translateY(100%);transition:transform .25s ease;}
#chat-panel.open{transform:translateY(0)}
#chat-header{background:#0a0a16;border-bottom:1px solid var(--border);padding:8px 10px;
  display:flex;justify-content:space-between;align-items:center;font-size:8px;color:var(--accent);flex-shrink:0;}
#chat-close{background:none;border:1px solid var(--border2);color:var(--dim);
  font-family:'Press Start 2P',monospace;font-size:6px;padding:3px 6px;cursor:pointer}
#chat-log{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:0}
.msg{font-size:7px;line-height:1.8;max-width:90%;padding:5px 8px;border:1px solid}
.msg.player{align-self:flex-end;color:#aadcff;border-color:#1a3050;background:#0a1828}
.msg.clawd{align-self:flex-start;color:var(--accent);border-color:#2a1e00;background:#1a1200}
#api-row{padding:6px 8px;border-top:1px solid var(--border);display:flex;gap:4px;flex-shrink:0;align-items:center}
#proxy-row{padding:3px 8px 5px;display:flex;gap:4px;flex-shrink:0;align-items:center}
#proxy-input{flex:1;background:#0d0d1e;border:1px solid var(--border2);color:var(--dim);
  font-family:'Press Start 2P',monospace;font-size:5px;padding:4px 6px;min-width:0}
#proxy-save{background:#1a1a2e;border:1px solid var(--border2);color:var(--text);
  font-family:'Press Start 2P',monospace;font-size:5px;padding:4px 6px;cursor:pointer;white-space:nowrap;flex-shrink:0}
#provider-btn{background:#1a1a2e;border:1px solid var(--accent);color:var(--accent);
  font-family:'Press Start 2P',monospace;font-size:5px;padding:5px 5px;cursor:pointer;white-space:nowrap;flex-shrink:0}
#provider-btn.gemini{border-color:#4a8fff;color:#4a8fff}
#api-input{flex:1;background:#0d0d1e;border:1px solid var(--border2);color:var(--dim);
  font-family:'Press Start 2P',monospace;font-size:6px;padding:5px 6px;min-width:0}
#api-save{background:#1a1a2e;border:1px solid var(--border2);color:var(--text);
  font-family:'Press Start 2P',monospace;font-size:6px;padding:5px 7px;cursor:pointer;white-space:nowrap;flex-shrink:0}
#input-row{padding:6px 8px 8px;border-top:1px solid var(--border);display:flex;gap:4px;flex-shrink:0}
#chat-input{flex:1;background:#0d0d1e;border:1px solid var(--border2);color:var(--text);
  font-family:'Press Start 2P',monospace;font-size:7px;padding:6px 8px}
#chat-input::placeholder{color:var(--dim)}
#send-btn{background:#1a1a2e;border:1px solid var(--accent);color:var(--accent);
  font-family:'Press Start 2P',monospace;font-size:6px;padding:6px 8px;cursor:pointer}
#send-btn:active{background:#2a2a10}
#death{position:absolute;inset:0;background:rgba(0,0,0,.88);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:90;}
#death h2{font-size:11px;color:var(--accent2);text-align:center;line-height:2}
#death p{font-size:7px;color:var(--dim);text-align:center;line-height:2}
#restart{background:var(--accent2);border:none;color:#fff;font-family:'Press Start 2P',monospace;
  font-size:8px;padding:10px 18px;cursor:pointer;margin-top:4px}
</style>
</head>
<body>
<div id="shell">
  <div id="topbar">
    <div class="logo">✦ CLAW'D</div>
    <div class="clock" id="clock">08:00</div>
    <div class="day" id="day-lbl">DAY 1</div>
  </div>
  <div id="stage">婴儿</div>
  <div id="scene">
    <div id="ground"></div>
    <div id="tree">
      <div class="t-leaves"><div class="t-apple ta1"></div><div class="t-apple ta2"></div><div class="t-apple ta3"></div></div>
      <div class="t-trunk"></div>
    </div>
    <div id="clawd-wrap">
      <div id="bubble"></div>
      <canvas id="clawd-canvas" width="16" height="16"></canvas>
    </div>
  </div>
  <div id="emotions">
    <div class="emo"><div class="emo-label"><span>🌙孤独</span><span id="v-lone">30</span></div><div class="emo-track"><div class="emo-fill" id="b-lone" style="width:30%;background:#7799cc"></div></div></div>
    <div class="emo"><div class="emo-label"><span>🤝信任</span><span id="v-trust">40</span></div><div class="emo-track"><div class="emo-fill" id="b-trust" style="width:40%;background:#44dd88"></div></div></div>
    <div class="emo"><div class="emo-label"><span>😊快乐</span><span id="v-happy">65</span></div><div class="emo-track"><div class="emo-fill" id="b-happy" style="width:65%;background:#f5c842"></div></div></div>
    <div class="emo"><div class="emo-label"><span>👀好奇</span><span id="v-curio">60</span></div><div class="emo-track"><div class="emo-fill" id="b-curio" style="width:60%;background:#cc88ff"></div></div></div>
    <div class="emo"><div class="emo-label"><span>💗依恋</span><span id="v-attach">20</span></div><div class="emo-track"><div class="emo-fill" id="b-attach" style="width:20%;background:#ff6699"></div></div></div>
    <div class="emo"><div class="emo-label"><span>😨恐惧</span><span id="v-fear">10</span></div><div class="emo-track"><div class="emo-fill" id="b-fear" style="width:10%;background:#ee4433"></div></div></div>
  </div>
  <div id="ptag">平平无奇</div>
  <div id="log">Claw'd 出生了，好好照顾它吧 ♥</div>
  <div id="actions">
    <button class="btn" id="btn-feed" onclick="doAction('feed')"><span class="bi">🍎</span>喂食</button>
    <button class="btn" id="btn-play" onclick="doAction('play')"><span class="bi">🎮</span>玩耍</button>
    <button class="btn" id="btn-sleep" onclick="doAction('sleep')"><span class="bi">💤</span>睡觉</button>
    <button class="btn" id="btn-chat" onclick="toggleChat()"><span class="bi">💬</span>对话</button>
  </div>
  <div id="chat-panel">
    <div id="chat-header">
      <span>与 Claw'd 对话</span>
      <button id="chat-close" onclick="toggleChat()">✕ 关闭</button>
    </div>
    <div id="chat-log"></div>
    <div id="api-row">
      <button id="provider-btn" onclick="toggleProvider()">Anthropic</button>
      <input id="api-input" type="password" placeholder="Anthropic API Key">
      <button id="api-save" onclick="saveKey()">保存</button>
    </div>
    <div id="proxy-row" style="display:none">
      <input id="proxy-input" type="text" placeholder="代理地址（选填）如: https://你的代理.com">
      <button id="proxy-save" onclick="saveProxy()">保存</button>
    </div>
    <div id="input-row">
      <input id="chat-input" type="text" placeholder="和 Claw'd 说话...">
      <button id="send-btn" onclick="sendChat()">发送</button>
    </div>
  </div>
  <div id="death">
    <h2>Claw'd<br>离开了...</h2>
    <p id="death-msg">它活了 1 天</p>
    <button id="restart" onclick="restartGame()">重新开始</button>
  </div>
</div>

// ── SPRITE RENDERER ──
const canvas = document.getElementById('clawd-canvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const spriteImgs = {};
for (const [name, src] of Object.entries(SPRITE_DATA)) {
  const img = new Image();
  img.src = src;
  spriteImgs[name] = img;
}

const ANIM_DEFS = {
  idle:  {frames:4,fps:1.5}, sleep:{frames:4,fps:0.7},
  eat:   {frames:4,fps:3.0}, happy:{frames:4,fps:4.0}, sad:{frames:4,fps:1.2},
};
let currentAnim = 'idle', animFrame = 0, animTimer = 0, flipX = false;

function drawEntityFrame(ectx, anim, frame, flip) {
  const img = spriteImgs[anim];
  if (!img || !img.complete) return;
  ectx.clearRect(0,0,16,16);
  ectx.save();
  if (flip) { ectx.translate(16,0); ectx.scale(-1,1); }
  ectx.drawImage(img, frame*16, 0, 16, 16, 0, 0, 16, 16);
  ectx.restore();
}
function drawFrame() { drawEntityFrame(ctx, currentAnim, animFrame, flipX); }

function tickAnim(dt) {
  const def = ANIM_DEFS[currentAnim];
  animTimer += dt;
  if (animTimer >= 1/def.fps) { animTimer=0; animFrame=(animFrame+1)%def.frames; drawFrame(); }
}
function setAnim(name, resetFrame=true) {
  if (currentAnim===name && !resetFrame) return;
  currentAnim=name;
  if (resetFrame) { animFrame=0; animTimer=0; }
  drawFrame();
}

// ── GAME STATE ──
const E = {LONE:0,TRUST:1,HAPPY:2,CURIO:3,ATTACH:4,FEAR:5};
let emo = [30,40,65,60,20,10];
let hunger=80, energy=85, health=100;
let day=1, gameHour=8, gameMin=0, totalMins=0;
let isSleeping=false, isDead=false, stage=0;
let minutesSinceInteract=0, actionLocked=false;
let apiKey=localStorage.getItem('clawd_apikey')||'';
let geminiKey=localStorage.getItem('clawd_geminikey')||'';
let geminiProxy=localStorage.getItem('clawd_geminiproxy')||'';
let apiProvider=localStorage.getItem('clawd_provider')||'anthropic';
let chatHistory=[];

const STAGE_NAMES=['蛋','婴儿','幼儿','少年','成年','老年'];
const STAGE_DAYS=[0,1,5,15,30,60];
const DRIFT=[.40,-.02,-.20,-.15,-.005,-.30];

// ── PHYSICS ──
const GRAV=700, BOUNCE=0.42, GFRIC=0.80, AFRIC=0.998, ESIZ=64;
const phys={x:100,y:100,vx:0,vy:0};
let isDragging=false, dragMoved=false;
let dragOffX=0, dragOffY=0, prevDX=0, prevDY=0, prevDT=0;
let wanderTimer=0;

// Trail pool
const trailPool=[];
// Clones array
const clones=[];
// Apples array
const apples=[];

function scn() { return document.getElementById('scene'); }
function gndY() { const s=scn(); return s.offsetHeight*0.55-ESIZ; }
function scnW() { return scn().offsetWidth; }

// ── DRAG ──
const clawdWrap = document.getElementById('clawd-wrap');

clawdWrap.addEventListener('pointerdown', e=>{
  if (isDead) return;
  e.preventDefault(); e.stopPropagation();
  isDragging=true; dragMoved=false;
  clawdWrap.setPointerCapture(e.pointerId);
  const r=scn().getBoundingClientRect();
  const cx=e.clientX-r.left, cy=e.clientY-r.top;
  dragOffX=cx-phys.x; dragOffY=cy-phys.y;
  prevDX=cx; prevDY=cy; prevDT=e.timeStamp;
  phys.vx=0; phys.vy=0;
  clawdWrap.style.cursor='grabbing';
  minutesSinceInteract=0;
},{passive:false});

window.addEventListener('pointermove', e=>{
  if (!isDragging) return;
  e.preventDefault();
  const r=scn().getBoundingClientRect();
  const cx=e.clientX-r.left, cy=e.clientY-r.top;
  if (Math.abs(cx-prevDX)+Math.abs(cy-prevDY)>5) dragMoved=true;
  phys.x=cx-dragOffX; phys.y=cy-dragOffY;
  prevDX=cx; prevDY=cy; prevDT=e.timeStamp;
},{passive:false});

window.addEventListener('pointerup', e=>{
  if (!isDragging) return;
  isDragging=false;
  clawdWrap.style.cursor='grab';
  const r=scn().getBoundingClientRect();
  const cx=e.clientX-r.left, cy=e.clientY-r.top;
  const dt=Math.max(0.016,(e.timeStamp-prevDT)/1000);
  phys.vx=(cx-prevDX)/dt*0.85;
  phys.vy=(cy-prevDY)/dt*0.85;
  const spd=Math.hypot(phys.vx,phys.vy);
  if (spd>900){phys.vx=phys.vx/spd*900;phys.vy=phys.vy/spd*900;}

  if (!dragMoved) {
    petClawd();
  } else {
    minutesSinceInteract=0;
    emo[E.HAPPY]=Math.min(100,emo[E.HAPPY]+3);
    clampEmo();
    if (spd>320 && clones.length<5 && Math.random()<0.55) spawnClone();
    checkTreeHit(spd);
  }
});

function petClawd() {
  if (isDead) return;
  minutesSinceInteract=0;
  emo[E.HAPPY] =Math.min(100,emo[E.HAPPY]+10);
  emo[E.TRUST] =Math.min(100,emo[E.TRUST]+3);
  emo[E.FEAR]  =Math.max(0,  emo[E.FEAR]-12);
  emo[E.ATTACH]=Math.min(100,emo[E.ATTACH]+1);
  emo[E.LONE]  =Math.max(0,  emo[E.LONE]-15);
  clampEmo();
  if (!isSleeping&&!actionLocked){
    setAnim('happy'); lockAction(1000);
    setTimeout(()=>{if(!isSleeping)setAnim('idle');},1000);
  }
  showBubble(['🥰','😊','💕','✨'][Math.floor(Math.random()*4)]);
  spawnParticle('💗');
  setLog('Claw\'d 蹭了蹭你的手...');
  updateUI();
}

// ── TREE COLLISION ──
function checkTreeHit(speed) {
  if (speed<80) return;
  const s=scn();
  const tL=s.offsetWidth-36-36, tT=s.offsetHeight*0.55-52;
  if (phys.x+ESIZ>tL && phys.x<tL+36 && phys.y<tT+52 && apples.length<3) {
    shakeTree(); spawnApple(tL+6+Math.random()*22, tT-8);
  }
}

function shakeTree() {
  const t=document.getElementById('tree');
  [6,-4,3,-2,0].forEach((deg,i)=>{
    setTimeout(()=>{ t.style.transition='transform 0.08s'; t.style.transform=`rotate(${deg}deg)`; },i*80);
  });
}

function spawnApple(x,y) {
  const s=scn();
  const el=document.createElement('div');
  el.style.cssText=`position:absolute;width:10px;height:10px;background:#c82020;
    box-shadow:inset -2px -2px 0 #801010;z-index:5;`;
  el.style.left=x+'px'; el.style.top=y+'px';
  s.appendChild(el);
  apples.push({el,x,y,vx:(Math.random()-.5)*80,vy:-70});
  setLog('苹果掉下来了！快去捡！');
}

// ── CLONES ──
function spawnClone() {
  const s=scn();
  const el=document.createElement('div');
  el.style.cssText='position:absolute;pointer-events:none;';
  const cnv=document.createElement('canvas');
  cnv.width=16; cnv.height=16;
  cnv.style.cssText='display:block;width:64px;height:64px;image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4));';
  const cCtx=cnv.getContext('2d');
  cCtx.imageSmoothingEnabled=false;
  el.appendChild(cnv);
  s.appendChild(el);
  clones.push({
    el,ctx:cCtx,
    x:phys.x+(Math.random()-.5)*40, y:phys.y,
    vx:(Math.random()-.5)*120, vy:-100-Math.random()*80,
    af:0, at:0, flipX:false, age:0,
  });
  spawnParticle('✨');
  setLog('一只小克隆出现了！用力甩能产生更多～');
}

// ── TRAIL ──
function initTrail() {
  const s=scn();
  for (let i=0;i<5;i++) {
    const el=document.createElement('canvas');
    el.width=16; el.height=16;
    el.style.cssText='position:absolute;width:64px;height:64px;image-rendering:pixelated;pointer-events:none;display:none;';
    s.appendChild(el);
    const tCtx=el.getContext('2d');
    tCtx.imageSmoothingEnabled=false;
    trailPool.push({el,ctx:tCtx});
  }
}

const trailPos=[];
function updateTrail(spd) {
  if (spd>180&&!isDragging) {
    trailPos.push({x:phys.x,y:phys.y,f:animFrame,fl:flipX});
    if (trailPos.length>5) trailPos.shift();
  } else if (trailPos.length>0) {
    trailPos.shift();
  }
  for (let i=0;i<5;i++) {
    const tp=trailPool[i];
    if (!tp) continue;
    if (i<trailPos.length) {
      const p=trailPos[i];
      const op=((i+1)/(trailPos.length+1)*0.35).toFixed(2);
      tp.el.style.display='block';
      tp.el.style.left=p.x+'px'; tp.el.style.top=p.y+'px';
      tp.el.style.opacity=op;
      drawEntityFrame(tp.ctx,currentAnim,p.f,p.fl);
    } else {
      tp.el.style.display='none';
    }
  }
}

// ── PHYSICS STEP ──
function physStep(dt) {
  if (isDead) return;
  const s=scn(), gY=gndY(), sW=scnW();

  if (!isDragging) {
    phys.vy+=GRAV*dt;
    phys.x+=phys.vx*dt;
    phys.y+=phys.vy*dt;
    phys.vx*=Math.pow(AFRIC,dt*60);

    if (phys.y>=gY) {
      phys.y=gY; phys.vy*=-BOUNCE; phys.vx*=GFRIC;
      if (Math.abs(phys.vy)<15) phys.vy=0;
    }
    if (phys.x<0){phys.x=0;phys.vx=Math.abs(phys.vx)*0.4;}
    if (phys.x>sW-ESIZ){phys.x=sW-ESIZ;phys.vx=-Math.abs(phys.vx)*0.4;}

    // Autonomous wander when settled
    if (!isSleeping && phys.y>=gY-2 && Math.abs(phys.vy)<5 && Math.abs(phys.vx)<15) {
      wanderTimer-=dt;
      if (wanderTimer<=0) {
        wanderTimer=3+Math.random()*5;
        phys.vx=(Math.random()-.5)*110;
      }
    }
    if (Math.abs(phys.vx)>15) flipX=phys.vx<0;
  }

  const spd=Math.hypot(phys.vx,phys.vy);
  clawdWrap.style.left=Math.round(phys.x)+'px';
  clawdWrap.style.top=Math.round(phys.y)+'px';
  updateTrail(spd);

  // Clones
  for (let i=clones.length-1;i>=0;i--) {
    const c=clones[i];
    c.age+=dt;
    const op=Math.max(0,0.72-c.age*0.011);
    if (op<=0){c.el.remove();clones.splice(i,1);continue;}
    c.el.style.opacity=op;
    const tx=phys.x+Math.cos(i*2.3+c.age*0.5)*30;
    c.vx+=(tx-c.x)*3*dt;
    c.vy+=(phys.y-c.y)*1.5*dt+GRAV*dt;
    c.vx*=Math.pow(0.995,dt*60);
    c.x+=c.vx*dt; c.y+=c.vy*dt;
    if (c.y>=gY){c.y=gY;c.vy*=-BOUNCE;c.vx*=GFRIC;if(Math.abs(c.vy)<15)c.vy=0;}
    if (c.x<0){c.x=0;c.vx*=-0.4;}
    if (c.x>sW-ESIZ){c.x=sW-ESIZ;c.vx*=-0.4;}
    c.flipX=c.vx<-15;
    c.el.style.left=Math.round(c.x)+'px';
    c.el.style.top=Math.round(c.y)+'px';
    c.at+=dt;
    if (c.at>1/1.5){c.at=0;c.af=(c.af+1)%4;}
    drawEntityFrame(c.ctx,isSleeping?'sleep':'idle',c.af,c.flipX);
  }

  // Apples
  const agY=s.offsetHeight*0.55-10;
  for (let i=apples.length-1;i>=0;i--) {
    const a=apples[i];
    a.vy+=GRAV*dt;
    a.x+=a.vx*dt; a.y+=a.vy*dt;
    if (a.y>=agY){a.y=agY;a.vy*=-0.3;a.vx*=0.8;if(Math.abs(a.vy)<8)a.vy=0;}
    if (a.x<0){a.x=0;a.vx*=-0.5;}
    if (a.x>sW-10){a.x=sW-10;a.vx*=-0.5;}
    a.el.style.left=Math.round(a.x)+'px';
    a.el.style.top=Math.round(a.y)+'px';
    // Pickup
    if (Math.hypot(phys.x+32-(a.x+5),phys.y+32-(a.y+5))<46&&!isDead&&!isSleeping&&!actionLocked){
      a.el.remove(); apples.splice(i,1);
      hunger=Math.min(100,hunger+22); health=Math.min(100,health+2);
      emo[E.HAPPY]=Math.min(100,emo[E.HAPPY]+15);
      emo[E.TRUST]=Math.min(100,emo[E.TRUST]+2);
      clampEmo();
      setAnim('eat'); lockAction(1600);
      setTimeout(()=>{if(!isSleeping)setAnim('idle');},1600);
      showBubble('😋🍎'); spawnParticle('🍎');
      setLog('Claw\'d 捡到苹果吃掉了！');
    }
  }
}

// ── GAME LOOP ──
let lastTs=0, accumSec=0;
const SECS_PER_GMIN=1.0;

function loop(ts) {
  if (!lastTs) lastTs=ts;
  const dt=Math.min((ts-lastTs)/1000,0.05);
  lastTs=ts;
  tickAnim(dt);
  physStep(dt);
  if (isSleeping) tickZzz(dt);
  accumSec+=dt;
  while (accumSec>=SECS_PER_GMIN){accumSec-=SECS_PER_GMIN;gameTick();}
  requestAnimationFrame(loop);
}

function gameTick() {
  if (isDead) return;
  totalMins++; minutesSinceInteract++;
  advanceTime();
  if (isSleeping){
    energy=Math.min(100,energy+0.8); hunger=Math.max(0,hunger-0.07);
    if (energy>=100) autoWake();
  } else {
    hunger=Math.max(0,hunger-0.25); energy=Math.max(0,energy-0.10);
    if (hunger<10) health=Math.max(0,health-0.5);
  }
  tickEmotions(); checkStage(); checkCritical(); updateUI();
}

function advanceTime() {
  gameMin++;
  if (gameMin>=60){gameMin=0;gameHour=(gameHour+1)%24;}
  if (gameHour===0&&gameMin===0) day++;
}

function tickEmotions() {
  for (let i=0;i<6;i++) emo[i]+=DRIFT[i];
  if (minutesSinceInteract>30){
    emo[E.LONE]+=0.04*(minutesSinceInteract-30);
    if (emo[E.LONE]>80) emo[E.TRUST]-=0.05;
  }
  if (gameHour>=22||gameHour<4){emo[E.CURIO]+=0.08;emo[E.FEAR]+=0.03;}
  else if (gameHour>=5&&gameHour<8){emo[E.HAPPY]+=0.05;emo[E.FEAR]-=0.05;}
  else if (gameHour>=13&&gameHour<17) emo[E.LONE]+=0.05;
  if (emo[E.LONE]>70){emo[E.HAPPY]-=0.15*(emo[E.LONE]/100);emo[E.CURIO]-=0.10*(emo[E.LONE]/100);}
  if (emo[E.FEAR]>50){emo[E.CURIO]-=0.12*(emo[E.FEAR]/100);emo[E.HAPPY]-=0.10*(emo[E.FEAR]/100);}
  if (emo[E.TRUST]>70) emo[E.HAPPY]+=0.05*((emo[E.TRUST]-70)/30);
  if (emo[E.ATTACH]>60) emo[E.LONE]-=0.10*((emo[E.ATTACH]-60)/40);
  if (emo[E.HAPPY]>75) emo[E.ATTACH]+=0.01;
  if (emo[E.TRUST]<15) emo[E.FEAR]+=0.20;
  clampEmo();
  if (!isSleeping&&!actionLocked){
    if (health<20||emo[E.FEAR]>70) setAnim('sad',false);
    else if (emo[E.LONE]>75||emo[E.HAPPY]<25) setAnim('sad',false);
    else if (emo[E.HAPPY]>75&&Math.random()<0.02){setAnim('happy');setTimeout(()=>setAnim('idle'),2000);}
    else setAnim('idle',false);
  }
}

function checkStage(){for(let i=STAGE_DAYS.length-1;i>=0;i--){if(day>=STAGE_DAYS[i]){stage=i;break;}}}
function checkCritical(){
  if (health<=0){die('starved');return;}
  if (hunger<10||health<20) emo[E.FEAR]=Math.min(100,emo[E.FEAR]+0.3);
}
function die(cause){
  isDead=true; setAnim('sad');
  document.getElementById('death-msg').textContent=`它活了 ${day} 天`;
  document.getElementById('death').style.display='flex';
  setLog(`💀 Claw'd 离开了...（${cause}）`);
}

// ── ACTIONS ──
function doAction(type){
  if (isDead||actionLocked) return;
  minutesSinceInteract=0;
  emo[E.LONE]=Math.max(0,emo[E.LONE]-18);
  if (type==='sleep'){
    if (isSleeping){autoWake();return;}
    if (energy>=90){showBubble('😤 不困！');return;}
    isSleeping=true; setAnim('sleep');
    document.getElementById('btn-sleep').querySelector('.bi').textContent='☀️';
    showBubble('💤'); setLog('Claw\'d 进入了甜蜜的梦乡...');
    emo[E.FEAR]-=5; clampEmo(); return;
  }
  if (isSleeping) return;
  lockAction(1200);
  if (type==='feed'){
    if (hunger>=95){showBubble('饱了~');return;}
    hunger=Math.min(100,hunger+22); health=Math.min(100,health+2);
    emo[E.HAPPY]=Math.min(100,emo[E.HAPPY]+12);
    emo[E.TRUST]=Math.min(100,emo[E.TRUST]+1.5);
    emo[E.FEAR] =Math.max(0,  emo[E.FEAR]-8);
    setAnim('eat'); setTimeout(()=>setAnim('idle'),1600);
    showBubble('😋'); spawnParticle('🍎'); setLog('Claw\'d 吃得美滋滋～');
  } else if (type==='play'){
    if (energy<15){showBubble('😴 太累了');return;}
    emo[E.HAPPY] =Math.min(100,emo[E.HAPPY]+20);
    emo[E.CURIO] =Math.min(100,emo[E.CURIO]+15);
    emo[E.ATTACH]=Math.min(100,emo[E.ATTACH]+0.5);
    emo[E.LONE]  =Math.max(0,  emo[E.LONE]-10);
    energy=Math.max(0,energy-12); hunger=Math.max(0,hunger-8);
    setAnim('happy'); setTimeout(()=>setAnim('idle'),2000);
    showBubble('🎉'); spawnParticle('⭐'); spawnParticle('💫');
    setLog('Claw\'d 玩得超开心！');
    // High joy → might spawn clone
    if (emo[E.HAPPY]>85&&clones.length<5&&Math.random()<0.3) spawnClone();
  }
  clampEmo(); updateUI();
}

function autoWake(){
  isSleeping=false; setAnim('idle');
  document.getElementById('btn-sleep').querySelector('.bi').textContent='💤';
  showBubble('☀️'); setLog('Claw\'d 精神饱满地醒来了！');
}

function clampEmo(){for(let i=0;i<6;i++) emo[i]=Math.max(0,Math.min(100,emo[i]));}

// ── ZZZ ──
let zzzTimer=0;
function tickZzz(dt){
  zzzTimer-=dt;
  if (zzzTimer<=0){zzzTimer=1.8+Math.random()*0.8;spawnZzz();}
}

// ── PARTICLES ──
function spawnParticle(emoji){
  const s=scn(), el=document.createElement('div');
  el.className='particle'; el.textContent=emoji;
  el.style.left=(phys.x+10+Math.random()*30)+'px';
  el.style.top=(phys.y-10)+'px';
  s.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
}
function spawnZzz(){
  const s=scn(), el=document.createElement('div');
  el.className='zzz-p'; el.textContent='z';
  el.style.left=(phys.x+30+Math.random()*10)+'px';
  el.style.top=(phys.y-5)+'px';
  s.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
}

// ── BUBBLE ──
let bubbleTO=null;
function showBubble(text,dur=1800){
  const b=document.getElementById('bubble');
  b.textContent=text; b.classList.add('show');
  clearTimeout(bubbleTO);
  bubbleTO=setTimeout(()=>b.classList.remove('show'),dur);
}

function lockAction(ms){actionLocked=true;setTimeout(()=>actionLocked=false,ms);}
function setLog(msg){document.getElementById('log').textContent=msg;}

// ── UI ──
const BAR_IDS=['lone','trust','happy','curio','attach','fear'];
const BAR_COLORS=['#7799cc','#44dd88','#f5c842','#cc88ff','#ff6699','#ee4433'];
function updateUI(){
  for (let i=0;i<6;i++){
    const fill=document.getElementById('b-'+BAR_IDS[i]);
    const val=document.getElementById('v-'+BAR_IDS[i]);
    const pct=Math.round(emo[i]);
    fill.style.width=pct+'%'; fill.style.background=BAR_COLORS[i];
    val.textContent=pct;
    fill.style.opacity=((i===0||i===5)&&emo[i]>70)?
      (0.6+0.4*Math.abs(Math.sin(Date.now()/300))).toFixed(2):1;
  }
  document.getElementById('ptag').textContent=getPersonality();
  document.getElementById('clock').textContent=
    String(gameHour).padStart(2,'0')+':'+String(gameMin).padStart(2,'0');
  document.getElementById('day-lbl').textContent='DAY '+day;
  document.getElementById('stage').textContent=STAGE_NAMES[stage];
}
function getPersonality(){
  const [lone,trust,happy,curio,attach,fear]=emo;
  if (fear>70) return '战战兢兢';
  if (lone>75) return '形单影只';
  if (attach>80&&trust>70) return '小跟班 🐾';
  if (curio>80) return '十万个为什么';
  if (happy>80) return '开心果 ✨';
  if (trust>80) return '超级信任你';
  if (lone>50&&happy<40) return '有点忧郁...';
  if (happy>65) return '心情不错';
  return '平平无奇';
}

// ── BACKGROUND ──
function buildScene(){
  const s=scn();
  for (let i=0;i<22;i++){
    const el=document.createElement('div');
    el.className='star';
    el.style.cssText=`width:${Math.random()<.3?2:1}px;height:${Math.random()<.3?2:1}px;`+
      `top:${Math.random()*50}%;left:${Math.random()*100}%;`+
      `animation-delay:${Math.random()*2}s;animation-duration:${1+Math.random()*2}s`;
    s.appendChild(el);
  }
  const g=document.getElementById('ground');
  for (let x=0;x<22;x++){
    const t=document.createElement('div');
    t.className='gt'; t.style.left=x*16+'px';
    t.style.background=x%2===0?'#3a5a30':'#2d4825';
    g.appendChild(t);
  }
  for (let i=0;i<2;i++){
    const c=document.createElement('div');
    c.className='cloud';
    c.style.cssText=`width:${32+Math.random()*32}px;height:${8+Math.random()*8}px;`+
      `top:${8+Math.random()*20}%;animation-duration:${22+Math.random()*12}s;animation-delay:${-Math.random()*22}s`;
    s.appendChild(c);
  }
}

function toggleChat(){
  const p=document.getElementById('chat-panel');
  p.classList.toggle('open');
  if (p.classList.contains('open')){
    document.getElementById('chat-input').focus();
    if (chatHistory.length===0) appendChat('clawd','（终于等到你来说话了...）');

}
function toggleProvider(){
  apiProvider=apiProvider==='anthropic'?'gemini':'anthropic';
  localStorage.setItem('clawd_provider',apiProvider);
  updateProviderUI();
}
function updateProviderUI(){
  const btn=document.getElementById('provider-btn');
  const inp=document.getElementById('api-input');
  const proxyRow=document.getElementById('proxy-row');
  const proxyInp=document.getElementById('proxy-input');
  if (apiProvider==='gemini'){
    btn.textContent='Gemini'; btn.classList.add('gemini');
    inp.placeholder=geminiKey?'Gemini Key 已保存 ✓':'Google Gemini API Key';
    proxyRow.style.display='flex';
    proxyInp.placeholder=geminiProxy?`代理: ${geminiProxy.slice(0,28)}...`:'代理地址（选填）如: https://你的代理.com';
  } else {
    btn.textContent='Anthropic'; btn.classList.remove('gemini');
    inp.placeholder=apiKey?'API Key 已保存 ✓':'Anthropic API Key';
    proxyRow.style.display='none';
  }
}
function saveProxy(){
  const v=document.getElementById('proxy-input').value.trim();
  geminiProxy=v;
  if (v) localStorage.setItem('clawd_geminiproxy',v);
  else localStorage.removeItem('clawd_geminiproxy');
  document.getElementById('proxy-input').value='';
  updateProviderUI();
}
function saveKey(){
  const k=document.getElementById('api-input').value.trim();
  if (!k) return;
  if (apiProvider==='gemini'){geminiKey=k;localStorage.setItem('clawd_geminikey',k);}
  else {apiKey=k;localStorage.setItem('clawd_apikey',k);}
  document.getElementById('api-input').value='';
  updateProviderUI();
}
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});

async function sendChat(){
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if (!text) return;
  input.value='';
  appendChat('player',text);
  minutesSinceInteract=0;
  emo[E.LONE] =Math.max(0,  emo[E.LONE]-20);
  emo[E.CURIO]=Math.min(100,emo[E.CURIO]+8);
  emo[E.TRUST]=Math.min(100,emo[E.TRUST]+0.5);
  emo[E.ATTACH]=Math.min(100,emo[E.ATTACH]+0.3);
  const activeKey=apiProvider==='gemini'?geminiKey:apiKey;
  if (!activeKey){
    appendChat('clawd',`（你还没有配置 ${apiProvider==='gemini'?'Gemini':'Anthropic'} API Key，我没办法回话...）`);
    return;
  }
  const systemPrompt=buildSystemPrompt();
  chatHistory.push({role:'user',content:text});
  if (chatHistory.length>12) chatHistory=chatHistory.slice(-12);
  appendChat('clawd','...');
  try {
    let reply;
    if (apiProvider==='gemini'){
      const geminiHistory=chatHistory.map(m=>({
        role:m.role==='assistant'?'model':'user',
        parts:[{text:m.content}]
      }));
      const ep=geminiProxy||'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent';
      const resp=await fetch(`${ep}?key=${activeKey}`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          system_instruction:{parts:[{text:systemPrompt}]},
          contents:geminiHistory,
          generationConfig:{maxOutputTokens:300},
        })
      });
      const data=await resp.json();
      if (!resp.ok) throw new Error(data?.error?.message||`HTTP ${resp.status}`);
      reply=data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim()||'（沉默）';
    } else {
      const resp=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':activeKey,
          'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,
          system:systemPrompt,messages:chatHistory})
      });
      const data=await resp.json();
      if (!resp.ok) throw new Error(data?.error?.message||`HTTP ${resp.status}`);
      reply=data?.content?.[0]?.text?.trim()||'（沉默）';
    }
    const msgs=document.getElementById('chat-log').querySelectorAll('.msg.clawd');
    msgs[msgs.length-1].textContent=reply;
    chatHistory.push({role:'assistant',content:reply});
  } catch(err){
    const msgs=document.getElementById('chat-log').querySelectorAll('.msg.clawd');
    msgs[msgs.length-1].textContent=`（出错：${err.message}）`;
  }
  updateUI();
}

function buildSystemPrompt(){
  const phase=['深夜','黎明','上午','下午','傍晚','深夜'][gameHour<4?0:gameHour<8?1:gameHour<12?2:gameHour<17?3:gameHour<21?4:5];
  const [lone,trust,happy,curio,attach,fear]=emo.map(v=>Math.round(v));
  const tag=getPersonality();
  const state=isSleeping?'睡觉中':isDead?'已离开':'清醒';
  const cloneInfo=clones.length>0?`\n当前有 ${clones.length} 只克隆体在跟随`:'';
  return `你是 Claw'd，一只橘色像素小生物，玩家的唯一电子宠物。你有完整的情感世界。不要提 AI。
用简短有个性的中文回复（1-3句），可用颜文字。${cloneInfo}

当前性格：【${tag}】
状态：${state} / 第${day}天 ${String(gameHour).padStart(2,'0')}:${String(gameMin).padStart(2,'0')} ${phase}
阶段：${STAGE_NAMES[stage]} | 饥饿:${Math.round(hunger)} | 精力:${Math.round(energy)}
情绪 — 孤独:${lone} 信任:${trust} 快乐:${happy} 好奇:${curio} 依恋:${attach} 恐惧:${fear}

回应规则：孤独高→冷淡；恐惧高→磕绊；依恋+信任高→撒娇；好奇高→反问；快乐低→无精打采。`;
}

function appendChat(role,text){
  const log=document.getElementById('chat-log');
  const div=document.createElement('div');
  div.className=`msg ${role}`;
  div.textContent=role==='player'?`▶ ${text}`:text;
  log.appendChild(div);
  log.scrollTop=log.scrollHeight;
}

// ── RESTART ──
function restartGame(){
  [hunger,energy,health,day,gameHour,gameMin,totalMins]=[80,85,100,1,8,0,0];
  emo=[30,40,65,60,20,10];
  isSleeping=false;isDead=false;stage=0;minutesSinceInteract=0;chatHistory=[];
  phys.x=scnW()/2-32; phys.y=gndY(); phys.vx=0; phys.vy=0;
  clones.forEach(c=>c.el.remove()); clones.length=0;
  apples.forEach(a=>a.el.remove()); apples.length=0;
  trailPos.length=0; trailPool.forEach(t=>t.el.style.display='none');
  document.getElementById('death').style.display='none';
  document.getElementById('btn-sleep').querySelector('.bi').textContent='💤';
  setAnim('idle'); setLog("Claw'd 重新出生了！好好照顾它吧 ♥"); updateUI();
}

// ── SAVE / LOAD ──
function saveGame(){
  const data={hunger,energy,health,day,gameHour,gameMin,totalMins,emo,stage,isSleeping,physX:phys.x,physY:phys.y};
  localStorage.setItem('clawd_save',JSON.stringify(data));
}
function loadGame(){
  const raw=localStorage.getItem('clawd_save');
  if (!raw) return;
  try {
    const d=JSON.parse(raw);
    hunger=d.hunger??80;energy=d.energy??85;health=d.health??100;
    day=d.day??1;gameHour=d.gameHour??8;gameMin=d.gameMin??0;
    totalMins=d.totalMins??0;emo=d.emo??[30,40,65,60,20,10];
    stage=d.stage??0;isSleeping=d.isSleeping??false;
    if (isSleeping){setAnim('sleep');document.getElementById('btn-sleep').querySelector('.bi').textContent='☀️';}
    // physX/physY will be set after layout in initPhys; store for later
    if (d.physX!=null) phys._savedX=d.physX;
    if (d.physY!=null) phys._savedY=d.physY;
  } catch(e){}
}

function initPhys(){
  const w=scnW(), h=scn().offsetHeight;
  if (w<10){setTimeout(initPhys,50);return;}
  phys.x=phys._savedX??w/2-32;
  phys.y=phys._savedY??h*0.55-ESIZ;
  clawdWrap.style.left=Math.round(phys.x)+'px';
  clawdWrap.style.top=Math.round(phys.y)+'px';
  initTrail();
}

setInterval(saveGame,30000);
setInterval(updateUI,500);

buildScene();
loadGame();
updateUI();
updateProviderUI();
drawFrame();
initPhys();
requestAnimationFrame(loop);
</script>
