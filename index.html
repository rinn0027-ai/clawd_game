<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claw'd</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shell">
  <div id="topbar">
    <div class="logo">✦ CLAW'D</div>
    <div class="clock" id="clock">08:00</div>
    <div class="day" id="day-lbl">DAY 1</div>
  </div>
  <div id="stage">婴儿</div>
  <div id="scene">
    <div id="ground"></div>
    <div id="tree">
      <div class="t-leaves"><div class="t-apple ta1"></div><div class="t-apple ta2"></div><div class="t-apple ta3"></div></div>
      <div class="t-trunk"></div>
    </div>
    <div id="clawd-wrap">
      <div id="bubble"></div>
      <canvas id="clawd-canvas" width="16" height="16"></canvas>
    </div>
  </div>
  <div id="emotions">
    <div class="emo"><div class="emo-label"><span>🌙孤独</span><span id="v-lone">30</span></div><div class="emo-track"><div class="emo-fill" id="b-lone" style="width:30%;background:#7799cc"></div></div></div>
    <div class="emo"><div class="emo-label"><span>🤝信任</span><span id="v-trust">40</span></div><div class="emo-track"><div class="emo-fill" id="b-trust" style="width:40%;background:#44dd88"></div></div></div>
    <div class="emo"><div class="emo-label"><span>😊快乐</span><span id="v-happy">65</span></div><div class="emo-track"><div class="emo-fill" id="b-happy" style="width:65%;background:#f5c842"></div></div></div>
    <div class="emo"><div class="emo-label"><span>👀好奇</span><span id="v-curio">60</span></div><div class="emo-track"><div class="emo-fill" id="b-curio" style="width:60%;background:#cc88ff"></div></div></div>
    <div class="emo"><div class="emo-label"><span>💗依恋</span><span id="v-attach">20</span></div><div class="emo-track"><div class="emo-fill" id="b-attach" style="width:20%;background:#ff6699"></div></div></div>
    <div class="emo"><div class="emo-label"><span>😨恐惧</span><span id="v-fear">10</span></div><div class="emo-track"><div class="emo-fill" id="b-fear" style="width:10%;background:#ee4433"></div></div></div>
  </div>
  <div id="ptag">平平无奇</div>
  <div id="log">Claw'd 出生了，好好照顾它吧 ♥</div>
  <div id="items-row">
    <button class="ibtn" id="btn-ball"><span>🔵</span>球</button>
    <button class="ibtn" id="btn-hammer"><span>🔨</span>锤</button>
    <button class="ibtn" id="btn-rock"><span>🪨</span>石头</button>
    <button class="ibtn" id="btn-bucket"><span>🪣</span>水桶</button>
    <button class="ibtn" id="btn-soap"><span>🧼</span>肥皂</button>
    <button class="ibtn" id="btn-clear"><span>🗑️</span>清理</button>
  </div>
  <div id="actions">
    <button class="btn" id="btn-feed"><span class="bi">🍎</span>喂食</button>
    <button class="btn" id="btn-play"><span class="bi">🎮</span>玩耍</button>
    <button class="btn" id="btn-sleep"><span class="bi">💤</span>睡觉</button>
    <button class="btn" id="btn-chat"><span class="bi">💬</span>对话</button>
  </div>
  <div id="chat-panel">
    <div id="chat-header">
      <span>与 Claw'd 对话</span>
      <button id="chat-close">✕ 关闭</button>
    </div>
    <div id="chat-log"></div>
    <div id="api-row">
      <button id="provider-btn">Anthropic</button>
      <input id="api-input" type="password" placeholder="Anthropic API Key">
      <button id="api-save">保存</button>
    </div>
    <div id="proxy-row" style="display:none">
      <input id="proxy-input" type="text" placeholder="代理地址（选填）如: https://你的代理.com">
      <button id="proxy-save">保存</button>
    </div>
    <div id="input-row">
      <input id="chat-input" type="text" placeholder="和 Claw'd 说话...">
      <button id="send-btn">发送</button>
    </div>
  </div>
  <div id="death">
    <h2>Claw'd<br>离开了...</h2>
    <p id="death-msg">它活了 1 天</p>
    <button id="restart">重新开始</button>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
